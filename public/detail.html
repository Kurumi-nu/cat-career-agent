<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スポット詳細 | ミラノア資料庫</title>
<style>
  :root {
    --ink: #1f2a30;
    --muted: #60717b;
    --paper: #f4f1e9;
    --panel: #ffffff;
    --line: rgba(31, 42, 48, 0.14);
    --aqua: #23858d;
    --coral: #d85b49;
    --gold: #c99a3d;
    --moss: #4f7457;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: "Avenir Next", "Helvetica Neue", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(244, 241, 233, 0.9);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
  }

  .topbar-inner,
  .wrap {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
  }

  .topbar-inner {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .brand {
    display: grid;
  }

  .brand span {
    color: var(--aqua);
    font-size: 0.78rem;
    font-weight: 900;
    line-height: 1;
  }

  .brand strong {
    font-size: 1.18rem;
    line-height: 1.25;
  }

  .back {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 0 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-weight: 900;
  }

  .hero {
    min-height: 500px;
    color: #fff;
    display: grid;
    align-items: end;
    background:
      linear-gradient(90deg, rgba(20, 30, 35, 0.82), rgba(20, 30, 35, 0.22)),
      url("/images/miranoa-hero.png") center / cover no-repeat;
  }

  .hero-inner {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 128px 0 54px;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 0 10px;
    color: #fff;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 900;
  }

  h1 {
    max-width: 660px;
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: clamp(2rem, 4.8vw, 3.8rem);
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: 0;
  }

  .summary {
    max-width: 560px;
    margin: 18px 0 0;
    color: rgba(255, 255, 255, 0.86);
    font-size: 0.98rem;
  }

  main {
    padding: 26px 0 64px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .section {
    padding: 24px;
  }

  .photo-section {
    padding: 0;
  }

  .spot-photo {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #d9ddd8;
  }

  .section + .section {
    border-top: 1px solid var(--line);
  }

  h2 {
    margin: 0 0 14px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: 1.28rem;
    line-height: 1.25;
  }

  p {
    margin: 0;
    color: var(--muted);
  }

  .facts {
    display: grid;
    gap: 0;
  }

  .fact {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 16px;
    padding: 15px 0;
    border-top: 1px solid var(--line);
  }

  .fact:first-child {
    border-top: 0;
    padding-top: 0;
  }

  .fact b {
    color: var(--aqua);
  }

  .fact span {
    color: var(--muted);
  }

  .rating {
    color: var(--gold);
    font-weight: 900;
  }

  .related {
    display: grid;
    gap: 10px;
  }

  .related a {
    display: grid;
    grid-template-columns: 76px 1fr;
    gap: 12px;
    padding: 10px;
    border: 1px solid var(--line);
    background: #fbfaf6;
    transition: border-color 0.16s ease, transform 0.16s ease;
  }

  .related img {
    width: 76px;
    height: 64px;
    object-fit: cover;
    background: #d9ddd8;
  }

  .related a:hover {
    border-color: rgba(35, 133, 141, 0.58);
    transform: translateY(-1px);
  }

  .related strong {
    display: block;
    color: var(--ink);
    line-height: 1.25;
  }

  .related a > span {
    display: grid;
    align-content: center;
    gap: 4px;
  }

  .related span {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .note {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .empty {
    padding: 46px 20px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }

    .hero {
      min-height: 470px;
    }

    .hero-inner {
      padding: 118px 0 48px;
    }

    h1 {
      max-width: 560px;
      font-size: clamp(1.8rem, 6vw, 3rem);
      line-height: 1.16;
    }

    .summary {
      max-width: 520px;
    }
  }

  @media (max-width: 560px) {
    .topbar-inner,
    .wrap,
    .hero-inner {
      width: min(100% - 28px, 1120px);
    }

    .topbar-inner {
      min-height: 66px;
    }

    .brand span {
      font-size: 0.7rem;
    }

    .brand strong {
      font-size: 1rem;
    }

    .back {
      min-height: 38px;
      padding: 0 10px;
      font-size: 0.84rem;
    }

    .hero {
      min-height: 440px;
      background-position: center;
    }

    .hero-inner {
      padding-top: 106px;
      padding-bottom: 34px;
    }

    .meta {
      gap: 6px;
      margin-bottom: 12px;
    }

    .chip {
      min-height: 27px;
      padding: 0 8px;
      font-size: 0.74rem;
    }

    h1 {
      max-width: 330px;
      font-size: clamp(1.55rem, 8vw, 2.15rem);
      line-height: 1.22;
    }

    .summary {
      max-width: 330px;
      margin-top: 14px;
      font-size: 0.88rem;
      line-height: 1.75;
    }

    main {
      padding: 18px 0 48px;
    }

    .layout {
      gap: 14px;
    }

    .section {
      padding: 18px;
    }

    .photo-section {
      padding: 0;
    }

    .spot-photo {
      aspect-ratio: 4 / 3;
    }

    h2 {
      font-size: 1.16rem;
    }

    p,
    .fact span,
    .related span,
    .note {
      font-size: 0.9rem;
    }

    .fact {
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 13px 0;
    }

    .related a {
      grid-template-columns: 64px 1fr;
    }

    .related img {
      width: 64px;
      height: 58px;
    }
  }

  @media (max-width: 420px) {
    .topbar-inner,
    .wrap,
    .hero-inner {
      width: min(100% - 24px, 1120px);
    }

    .hero {
      min-height: 410px;
      background-position: 55% center;
    }

    h1,
    .summary {
      max-width: 300px;
    }

    h1 {
      font-size: clamp(1.42rem, 8.2vw, 1.9rem);
    }

    .back {
      padding: 0 9px;
    }

    .related a {
      grid-template-columns: 58px 1fr;
      gap: 10px;
    }

    .related img {
      width: 58px;
      height: 54px;
    }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span>Miranoa Archive</span>
        <strong>ミラノア資料庫</strong>
      </a>
      <a class="back" href="/">一覧へ戻る</a>
    </div>
  </header>

  <section id="hero" class="hero">
    <div class="hero-inner">
      <div id="meta" class="meta"></div>
      <h1 id="name">読み込み中</h1>
      <p id="summary" class="summary">SQLiteからスポット情報を取得しています。</p>
    </div>
  </section>

  <main class="wrap">
    <div id="detail" class="layout">
      <section class="panel">
        <div class="section photo-section">
          <img id="spotPhoto" class="spot-photo" src="" alt="">
        </div>
        <div class="section">
          <h2>概要</h2>
          <p id="description"></p>
        </div>
        <div class="section">
          <h2>旅のメモ</h2>
          <div class="facts">
            <div class="fact"><b>エリア</b><span id="area"></span></div>
            <div class="fact"><b>カテゴリ</b><span id="category"></span></div>
            <div class="fact"><b>タグ</b><span id="tag"></span></div>
            <div class="fact"><b>おすすめ</b><span id="bestTime"></span></div>
            <div class="fact"><b>アクセス</b><span id="access"></span></div>
            <div class="fact"><b>評価</b><span id="rating" class="rating"></span></div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="section">
          <h2>関連スポット</h2>
          <div id="related" class="related"></div>
        </div>
      </aside>
    </div>
    <p class="note">この詳細情報は架空です。データは `miranoa.db` の `places` テーブルから取得しています。</p>
  </main>

<script src="/site-data.js"></script>
<script>
  const ids = {
    meta: document.querySelector("#meta"),
    name: document.querySelector("#name"),
    summary: document.querySelector("#summary"),
    description: document.querySelector("#description"),
    area: document.querySelector("#area"),
    category: document.querySelector("#category"),
    tag: document.querySelector("#tag"),
    bestTime: document.querySelector("#bestTime"),
    access: document.querySelector("#access"),
    rating: document.querySelector("#rating"),
    spotPhoto: document.querySelector("#spotPhoto"),
    related: document.querySelector("#related"),
    detail: document.querySelector("#detail")
  };

  function placeIdFromPath() {
    const id = Number(location.pathname.split("/").filter(Boolean).pop());
    return Number.isInteger(id) && id > 0 ? id : null;
  }

  async function fetchJson(url) {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`${response.status} ${response.statusText}`);
    }
    return response.json();
  }

  function renderRelated(places) {
    if (!places.length) {
      ids.related.innerHTML = `<p>近いスポットはまだ登録されていません。</p>`;
      return;
    }
    ids.related.innerHTML = places.map((place) => `
      <a href="/places/${place.id}">
        <img src="${place.image || "/images/miranoa-hero.png"}" alt="${place.name}の写真" loading="lazy">
        <span>
          <strong>${place.name}</strong>
          <span>${place.category} / ${place.area} / Rating ${place.rating.toFixed(1)}</span>
        </span>
      </a>
    `).join("");
  }

  function fallbackDetail(id) {
    const place = window.MIRANOA_PLACES.find((item) => item.id === id);
    if (!place) return null;
    const related = window.MIRANOA_PLACES
      .filter((item) => item.id !== place.id && (item.category === place.category || item.area === place.area))
      .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name, "ja"))
      .slice(0, 3);
    return { place, related };
  }

  function render(data) {
    const place = data.place;
    const image = place.image || "/images/miranoa-hero.png";
    document.title = `${place.name} | ミラノア資料庫`;
    ids.meta.innerHTML = `
      <span class="chip">${place.category}</span>
      <span class="chip">${place.area}</span>
      <span class="chip">${place.tag}</span>
    `;
    document.querySelector("#hero").style.backgroundImage =
      `linear-gradient(90deg, rgba(20, 30, 35, 0.82), rgba(20, 30, 35, 0.22)), url("${image}")`;
    ids.name.textContent = place.name;
    ids.summary.textContent = `${place.area}にある${place.category}スポット。おすすめは${place.best_time}です。`;
    ids.spotPhoto.src = image;
    ids.spotPhoto.alt = `${place.name}の写真`;
    ids.description.textContent = place.description;
    ids.area.textContent = place.area;
    ids.category.textContent = place.category;
    ids.tag.textContent = place.tag;
    ids.bestTime.textContent = place.best_time;
    ids.access.textContent = place.access;
    ids.rating.textContent = `Rating ${place.rating.toFixed(1)}`;
    renderRelated(data.related);
  }

  function showError(message) {
    ids.name.textContent = "詳細を表示できません";
    ids.summary.textContent = message;
    ids.detail.innerHTML = `<section class="panel empty">${message}</section>`;
  }

  async function boot() {
    const id = placeIdFromPath();
    if (!id) {
      showError("URLのスポットIDが正しくありません。");
      return;
    }
    let data;
    try {
      data = await fetchJson(`/api/places/${id}`);
    } catch (error) {
      data = fallbackDetail(id);
    }
    if (!data) {
      showError("指定されたスポットは見つかりませんでした。");
      return;
    }
    render(data);
  }

  boot().catch((error) => showError(`データを読み込めませんでした。${error.message}`));
</script>
</body>
</html>
