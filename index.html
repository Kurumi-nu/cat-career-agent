<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミラノア資料庫 | 架空都市情報アプリ</title>
<style>
  :root {
    --ink: #1f2a30;
    --muted: #60717b;
    --paper: #f4f1e9;
    --panel: #ffffff;
    --line: rgba(31, 42, 48, 0.14);
    --aqua: #23858d;
    --coral: #d85b49;
    --gold: #c99a3d;
    --moss: #4f7457;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: "Avenir Next", "Helvetica Neue", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.65;
    overflow-x: hidden;
  }

  button,
  input {
    font: inherit;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(244, 241, 233, 0.88);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
  }

  .topbar-inner {
    width: min(1200px, calc(100% - 32px));
    min-height: 72px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .brand {
    display: grid;
    gap: 0;
  }

  .brand span {
    color: var(--aqua);
    font-size: 0.78rem;
    font-weight: 500;
    line-height: 1;
  }

  .brand strong {
    font-size: 1.18rem;
    line-height: 1.25;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 500;
  }

  .status::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--moss);
  }

  .hero {
    min-height: clamp(480px, 72vh, 640px);
    position: relative;
    display: grid;
    align-items: end;
    color: #fff;
    background:
      linear-gradient(90deg, rgba(20, 30, 35, 0.8), rgba(20, 30, 35, 0.2)),
      url("images/miranoa-hero.png") center / cover no-repeat;
  }

  .hero-inner {
    width: min(1200px, calc(100% - 32px));
    margin: 0 auto;
    padding: 130px 0 58px;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: #f1dca4;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.08em;
  }

  h1 {
    max-width: 590px;
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: clamp(1.55rem, 3.1vw, 2.55rem);
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: 0;
  }

  .hero p {
    max-width: 520px;
    margin: 18px 0 0;
    color: rgba(255, 255, 255, 0.84);
    font-size: 0.94rem;
  }

  main {
    width: min(1200px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 64px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    margin-bottom: 18px;
  }

  .search {
    min-height: 50px;
    width: 100%;
    padding: 0 16px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
  }

  .search:focus {
    border-color: var(--aqua);
    box-shadow: 0 0 0 3px rgba(35, 133, 141, 0.16);
  }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .filter {
    min-height: 50px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
    background: var(--panel);
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .filter.active {
    color: #fff;
    background: var(--ink);
    border-color: var(--ink);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat {
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .stat b {
    display: block;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .stat strong {
    display: block;
    margin-top: 4px;
    font-size: 1.8rem;
    line-height: 1;
  }

  .content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .panel-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
  }

  .panel-head h2 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: 1.18rem;
  }

  .count {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 14px;
  }

  .place-card {
    min-height: 0;
    border: 1px solid var(--line);
    background: #fffdf8;
    display: grid;
    grid-template-rows: auto 1fr;
    align-content: space-between;
    color: inherit;
    overflow: hidden;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
  }

  .place-card:hover {
    border-color: rgba(35, 133, 141, 0.58);
    box-shadow: 0 16px 34px rgba(31, 42, 48, 0.12);
    transform: translateY(-2px);
  }

  .place-photo {
    display: block;
    width: 100%;
    height: auto;
    min-height: 0;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    background: #d9ddd8;
  }

  .place-body {
    min-height: 236px;
    padding: 20px;
    display: grid;
    align-content: space-between;
    gap: 22px;
    background: #fffdf8;
  }

  .place-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 9px;
    color: #16747d;
    background: #e6f3f2;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 500;
  }

  .chip.area {
    color: #bd4b3d;
    background: #f7e8e4;
  }

  .place-card h3 {
    margin: 0 0 8px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: 1.35rem;
    line-height: 1.25;
  }

  .place-card p {
    margin: 0;
    color: #43555f;
    font-size: 0.96rem;
    line-height: 1.78;
  }

  .details {
    display: grid;
    gap: 8px;
    color: #53646d;
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .details strong {
    color: var(--ink);
  }

  .rating {
    color: var(--gold);
    font-weight: 500;
  }

  .open-detail {
    color: var(--aqua);
    font-weight: 500;
  }

  .events {
    padding: 12px;
    display: grid;
    gap: 12px;
  }

  .event {
    padding: 16px;
    border: 1px solid var(--line);
    background: #fbfaf6;
  }

  .event b {
    color: var(--coral);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .event h3 {
    margin: 6px 0 6px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", Georgia, serif;
    font-size: 1.08rem;
    line-height: 1.25;
  }

  .event p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .empty {
    padding: 42px 20px;
    color: var(--muted);
    text-align: center;
  }

  .footer-note {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.88rem;
  }

  @media (max-width: 940px) {
    .toolbar,
    .content {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: 1fr 1fr;
    }

    .filters {
      width: 100%;
    }

    .hero {
      min-height: 520px;
      background-position: center;
    }

    .hero-inner {
      padding: 120px 0 48px;
    }

    h1 {
      max-width: 520px;
      font-size: clamp(1.5rem, 5.2vw, 2.3rem);
    }
  }

  @media (max-width: 760px) {
    main,
    .topbar-inner,
    .hero-inner {
      width: min(100% - 28px, 1200px);
    }

    .cards {
      gap: 10px;
      padding: 10px;
    }

    .place-card {
      grid-template-rows: auto 1fr;
    }

    .place-body {
      min-height: 0;
    }

    .panel-head {
      padding: 16px;
    }
  }

  @media (max-width: 640px) {
    .topbar-inner {
      min-height: 66px;
    }

    .status {
      display: none;
    }

    .brand span {
      font-size: 0.7rem;
    }

    .brand strong {
      font-size: 1rem;
    }

    .hero {
      min-height: 500px;
      background:
        linear-gradient(180deg, rgba(20, 30, 35, 0.28), rgba(20, 30, 35, 0.78)),
        url("images/miranoa-hero.png") center / cover no-repeat;
    }

    .hero-inner {
      width: min(100% - 28px, 1200px);
      padding-top: 108px;
      padding-bottom: 34px;
    }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 0.72rem;
    }

    h1 {
      max-width: 340px;
      font-size: clamp(1.38rem, 7.2vw, 1.9rem);
      line-height: 1.22;
    }

    .hero p {
      max-width: 340px;
      margin-top: 14px;
      font-size: 0.88rem;
      line-height: 1.75;
    }

    .stats,
    .cards {
      grid-template-columns: 1fr;
    }

    .toolbar {
      gap: 10px;
      margin-bottom: 14px;
    }

    .search,
    .filter {
      min-height: 46px;
    }

    .filters {
      margin-right: -14px;
      padding-right: 14px;
    }

    .stat {
      padding: 15px;
    }

    .stat strong {
      font-size: 1.55rem;
    }

    .content {
      gap: 14px;
    }

    .place-card {
      display: block;
      min-height: 0;
    }

    .place-photo {
      width: 100%;
      min-height: 0;
      aspect-ratio: 4 / 3;
    }

    .place-body {
      padding: 18px 16px 20px;
      gap: 18px;
      background: #fffdf8;
      border-top: 1px solid var(--line);
    }

    .place-card h3 {
      font-size: 1.25rem;
    }

    .place-card p,
    .event p,
    .details {
      font-size: 0.92rem;
    }
  }

  @media (max-width: 420px) {
    main,
    .topbar-inner,
    .hero-inner {
      width: min(100% - 24px, 1200px);
    }

    .hero {
      min-height: 470px;
      background-position: 55% center;
    }

    h1,
    .hero p {
      max-width: 310px;
    }

    h1 {
      font-size: clamp(1.32rem, 7.6vw, 1.7rem);
    }

    .hero p {
      font-size: 0.84rem;
    }

    .stats {
      gap: 10px;
    }

    .place-card {
      display: block;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span>Miranoa Archive</span>
          <strong>ミラノア資料庫</strong>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow">FICTIONAL CITY DATABASE</p>
        <h1>架空都市の情報を、検索して閲覧する。</h1>
        <p>ミラノア市の名所、食、建築、自然、季節イベントをSQLiteに保存し、API経由で表示する小さなWebアプリです。</p>
      </div>
    </section>

    <main>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="例: 運河、夜、旧市街、市場" aria-label="検索">
        <div id="filters" class="filters" aria-label="カテゴリ絞り込み"></div>
      </div>

      <section class="stats" aria-label="データ概要">
        <div class="stat">
          <b>PLACES</b>
          <strong id="totalPlaces">-</strong>
        </div>
        <div class="stat">
          <b>AVG RATING</b>
          <strong id="averageRating">-</strong>
        </div>
        <div class="stat">
          <b>DATABASE</b>
          <strong>SQLite</strong>
        </div>
      </section>

      <div class="content">
        <section class="panel">
          <div class="panel-head">
            <h2>スポット一覧</h2>
            <span id="resultCount" class="count">読み込み中</span>
          </div>
          <div id="places" class="cards"></div>
        </section>

        <aside class="panel">
          <div class="panel-head">
            <h2>季節イベント</h2>
          </div>
          <div id="events" class="events"></div>
        </aside>
      </div>

      <p class="footer-note">このアプリの情報はすべて架空です。データは起動時に `miranoa.db` に自動作成されます。</p>
    </main>
  </div>

<script src="/site-data.js"></script>
<script>
  const state = {
    category: "all",
    query: "",
    categories: []
  };

  const els = {
    search: document.querySelector("#search"),
    filters: document.querySelector("#filters"),
    places: document.querySelector("#places"),
    events: document.querySelector("#events"),
    resultCount: document.querySelector("#resultCount"),
    totalPlaces: document.querySelector("#totalPlaces"),
    averageRating: document.querySelector("#averageRating")
  };

  async function fetchJson(url) {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`${response.status} ${response.statusText}`);
    }
    return response.json();
  }

  function fallbackCategories() {
    const counts = new Map();
    window.MIRANOA_PLACES.forEach((place) => {
      counts.set(place.category, (counts.get(place.category) || 0) + 1);
    });
    return Array.from(counts, ([category, count]) => ({ category, count }))
      .sort((a, b) => a.category.localeCompare(b.category, "ja"));
  }

  function fallbackStats() {
    const total = window.MIRANOA_PLACES.length;
    const average = window.MIRANOA_PLACES.reduce((sum, place) => sum + place.rating, 0) / total;
    return {
      totalPlaces: total,
      averageRating: Math.round(average * 10) / 10,
      categories: fallbackCategories()
    };
  }

  function fallbackPlaces() {
    const query = state.query.toLowerCase();
    return window.MIRANOA_PLACES
      .filter((place) => state.category === "all" || place.category === state.category)
      .filter((place) => {
        if (!query) return true;
        return [place.name, place.area, place.tag, place.description]
          .some((value) => value.toLowerCase().includes(query));
      })
      .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name, "ja"));
  }

  function placeCard(place) {
    const image = place.image || "/images/miranoa-hero.png";
    return `
      <a class="place-card" href="/places/${place.id}/?v=spot-${place.id}" aria-label="${place.name}の詳細を見る">
        <img class="place-photo" src="${image}" alt="${place.name}の写真" loading="lazy">
        <div class="place-body">
          <div>
            <div class="place-meta">
              <span class="chip">${place.category}</span>
              <span class="chip area">${place.area}</span>
            </div>
            <h3>${place.name}</h3>
            <p>${place.description}</p>
          </div>
          <div class="details">
            <span><strong>おすすめ:</strong> ${place.best_time}</span>
            <span><strong>アクセス:</strong> ${place.access}</span>
            <span class="rating">Rating ${place.rating.toFixed(1)}</span>
            <span class="open-detail">詳細を見る</span>
          </div>
        </div>
      </a>
    `;
  }

  function eventCard(event) {
    return `
      <article class="event">
        <b>${event.season} / ${event.date_label}</b>
        <h3>${event.name}</h3>
        <p>${event.description}</p>
      </article>
    `;
  }

  function renderFilters() {
    const filters = [{ category: "all", count: null }, ...state.categories];
    els.filters.innerHTML = filters.map((item) => {
      const label = item.category === "all" ? "すべて" : `${item.category} ${item.count}`;
      const active = item.category === state.category ? " active" : "";
      return `<button class="filter${active}" type="button" data-category="${item.category}">${label}</button>`;
    }).join("");
  }

  async function loadPlaces() {
    const params = new URLSearchParams();
    params.set("category", state.category);
    if (state.query) {
      params.set("q", state.query);
    }
    let places;
    try {
      places = await fetchJson(`/api/places?${params.toString()}`);
    } catch (error) {
      places = fallbackPlaces();
    }
    els.resultCount.textContent = `${places.length}件`;
    els.places.innerHTML = places.length
      ? places.map(placeCard).join("")
      : `<div class="empty">該当する架空情報がありません。</div>`;
  }

  async function boot() {
    let stats;
    let events;
    try {
      [stats, events] = await Promise.all([
        fetchJson("/api/stats"),
        fetchJson("/api/events")
      ]);
    } catch (error) {
      stats = fallbackStats();
      events = window.MIRANOA_EVENTS;
    }
    state.categories = stats.categories;
    els.totalPlaces.textContent = stats.totalPlaces;
    els.averageRating.textContent = stats.averageRating;
    els.events.innerHTML = events.map(eventCard).join("");
    renderFilters();
    await loadPlaces();
  }

  els.search.addEventListener("input", () => {
    state.query = els.search.value.trim();
    loadPlaces().catch(showError);
  });

  els.filters.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-category]");
    if (!button) return;
    state.category = button.dataset.category;
    renderFilters();
    loadPlaces().catch(showError);
  });

  function showError(error) {
    els.resultCount.textContent = "エラー";
    els.places.innerHTML = `<div class="empty">データを読み込めませんでした。${error.message}</div>`;
  }

  boot().catch(showError);
</script>
</body>
</html>
